---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inference
resources:
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml
  - rbac-semaphore-reader.yaml

# The gateway's whole policy is this ConfigMap: the model list and routing
# rules in config.yaml, and the four callbacks that run on every request.
# A policy change is a commit; Flux rolls the pod.
configMapGenerator:
  - name: litellm-config
    files:
      - config.yaml
      - overflow_notice.py
      - loop_breaker.py
      - system_message_normalizer.py
      - custom_auth.py
